<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · NorthOps Prophet</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="login-body">
    <div class="bg"></div>
    <main class="login-wrap">
      <form class="login-card" id="login-form" autocomplete="on">
        <p class="eyebrow">NorthOps · Internal</p>
        <h1>Prophet</h1>
        <p class="lede">Sign in to remake approved TikTok formats for NorthOps clients.</p>
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          inputmode="email"
          autocomplete="username"
          required
          placeholder="admin@northops.com"
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <p class="login-error hidden" id="login-error">Invalid email or password</p>
        <button type="submit" id="signin">Sign in</button>
      </form>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
