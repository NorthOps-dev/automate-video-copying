[project]
name = "videocopier"
version = "0.1.0"
description = "NorthOps Prophet — internal tool that copies a viral edit onto your footage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "itsdangerous>=2.2.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "numpy>=2.0.0",
  "opencv-python-headless>=4.10.0",
  "soundfile>=0.12.1",
  "scipy>=1.13.0",
  "yt-dlp>=2025.1.0",
  "gdown>=5.2.0",
  "google-api-python-client>=2.150.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
  "faster-whisper>=1.1.0",
  "open-clip-torch>=2.29.0",
  "torch>=2.4.0",
  "pillow>=10.4.0",
  "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
videocopier = "videocopier.__main__:main"
prophet = "videocopier.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["videocopier"]
